name: Fetch listings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:   # also started by the "Check now" button on the settings page

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m homenotif migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m homenotif fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HOMENOTIF_SMTP_USER: ${{ secrets.HOMENOTIF_SMTP_USER }}
          HOMENOTIF_SMTP_PASSWORD: ${{ secrets.HOMENOTIF_SMTP_PASSWORD }}
          HOMENOTIF_IMAP_USER: ${{ secrets.HOMENOTIF_IMAP_USER }}
          HOMENOTIF_IMAP_PASSWORD: ${{ secrets.HOMENOTIF_IMAP_PASSWORD }}
