name: Daily digest

on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 Swiss winter time, 08:00 summer time
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m homenotif digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HOMENOTIF_SMTP_USER: ${{ secrets.HOMENOTIF_SMTP_USER }}
          HOMENOTIF_SMTP_PASSWORD: ${{ secrets.HOMENOTIF_SMTP_PASSWORD }}
