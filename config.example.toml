# Copy to config.toml and edit. Passwords are read from environment variables, never from this file.

[search]
min_rooms = 2.5
max_rooms = 4.5
min_rent = 0
max_rent = 2500          # CHF per month
min_area = 0             # m², 0 = don't care
center = [46.948, 7.447] # lat, lon of where you want to live (here: Bern)
radius_km = 8
zipcodes = []            # optional whitelist, e.g. [3005, 3006]; used when a listing has no coordinates
exclude_keywords = ["WG-Zimmer", "Parkplatz"]  # case-insensitive, matched against title + description

[flatfox]
enabled = true
categories = ["APARTMENT"]  # also possible: "HOUSE", "SHARED"

[anibis]
enabled = true
# Filter on anibis.ch (location, rent, ...) and paste the resulting URLs here.
search_urls = [
  "https://www.anibis.ch/de/q/immobilien-wohnungen/Ak8CqcmVhbEVzdGF0ZZSRkqtsaXN0aW5nVHlwZalhcGFydG1lbnTAwMA",
]
max_pages = 2

# Reads saved-search alert emails from ImmoScout24, Homegate, Comparis, Newhome.
# Use a dedicated mailbox: every unread mail in the folder is read and marked as seen.
[email_alerts]
enabled = false
host = "imap.gmail.com"
user = "my.flat.alerts@gmail.com"
password_env = "HOMENOTIF_IMAP_PASSWORD"
folder = "INBOX"

[notify]
enabled = false          # false = new matches are only printed to the console
smtp_host = "smtp.gmail.com"
smtp_port = 587
user = "my.flat.alerts@gmail.com"
password_env = "HOMENOTIF_SMTP_PASSWORD"
from = "my.flat.alerts@gmail.com"
to = "me@example.com"

[app]
db_path = "data/listings.db"
poll_minutes = 15
dashboard_url = "http://127.0.0.1:8000"
